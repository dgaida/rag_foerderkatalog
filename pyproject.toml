[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-foerderkatalog"
version = "0.3.0"
description = "RAG-basierte semantische Suche in deutschen Forschungsförderprojekten"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "dgaida", email = "info@example.com"}
]
keywords = ["rag", "semantic-search", "llm", "research-funding", "faiss", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "faiss-cpu>=1.8.0",
    "gradio>=4.0.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "ollama>=0.3.0",
    "python-dotenv>=1.0.0",
    "llm_client @ git+https://github.com/dgaida/llm_client.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.21.1",
    "black>=23.12.1",
    "isort>=5.13.2",
    "flake8>=6.1.0",
    "mypy>=1.8.0",
    "faker>=22.0.0",
    "freezegun>=1.4.0",
    "responses>=0.24.1",
]

test = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.21.1",
]

lint = [
    "black>=23.12.1",
    "isort>=5.13.2",
    "flake8>=6.1.0",
    "mypy>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/dgaida/rag-foerderkatalog"
Documentation = "https://github.com/dgaida/rag-foerderkatalog#readme"
Repository = "https://github.com/dgaida/rag-foerderkatalog"
Issues = "https://github.com/dgaida/rag-foerderkatalog/issues"

[project.scripts]
rag-foerderkatalog = "main:main"

[tool.setuptools]
packages = ["src", "src.search", "src.embeddings", "src.llm", "src.utils"]

[tool.setuptools.package-data]
src = ["py.typed"]

# ===== pytest Configuration =====
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=src",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=40",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "requires_ollama: Tests that require Ollama running",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ===== Coverage Configuration =====
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
    "*/.venv/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# ===== Black Configuration =====
[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | data
  | logs
)/
'''

# ===== isort Configuration =====
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/data/*", "*/logs/*", "*/.venv/*"]

# ===== mypy Configuration =====
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "ollama.*",
    "llm_client.*",
    "faiss.*",
    "gradio.*",
]
ignore_missing_imports = true

# ===== Flake8 Configuration =====
# Note: Flake8 doesn't support pyproject.toml natively
# This is for documentation; create setup.cfg for actual config
# [tool.flake8] - Not supported, use setup.cfg instead

# ===== Ruff Configuration (Alternative to Flake8) =====
[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["E501"]

[tool.ruff.isort]
known-first-party = ["src"]

# ===== Bandit Configuration (Security Linting) =====
[tool.bandit]
exclude_dirs = ["tests", "data", "logs"]
skips = ["B101", "B601"]
